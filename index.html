<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#800020" />
  <meta name="description" content="Mémoire des Cris de Monstres — jeu de mémoire sonore adapté mobile, tablette et PC." />
  <title>Mémoire des Cris de Monstres</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/images/fantome.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app" aria-live="polite">
    <section id="game" class="game" aria-label="Mémoire des Cris de Monstres">
      <div class="stage" id="stage">
        <img class="stage-bg" src="assets/images/background.png" alt="Décor de théâtre" draggable="false" />

        <header class="hud">
          <div class="score" aria-label="Nombre de victoires">
            <span>Victoires</span>
            <strong id="scoreValue">0 / 4</strong>
          </div>
          <button id="soundToggle" class="icon-button" type="button" aria-pressed="false" aria-label="Couper le son" title="Couper le son">🔊</button>
        </header>

        <div class="center-panel">
          <h1 id="titleText">Mémoire des Cris de Monstres</h1>
          <p id="statusText">Écoute les monstres puis reproduis la séquence.</p>
          <button id="mainButton" class="main-button" type="button">Jouer</button>
        </div>

        <div id="monsterGrid" class="monster-grid" aria-label="Monstres">
          <button class="monster" data-monster="sorciere" type="button" aria-label="Sorcière — écouter son cri">
            <img src="assets/images/sorciere.png" alt="Sorcière" draggable="false" />
            <span>Sorcière</span>
          </button>
          <button class="monster" data-monster="vampire" type="button" aria-label="Vampire — écouter son cri">
            <img src="assets/images/vampire.png" alt="Vampire" draggable="false" />
            <span>Vampire</span>
          </button>
          <button class="monster" data-monster="yeti" type="button" aria-label="Yéti — écouter son cri">
            <img src="assets/images/yeti.png" alt="Yéti" draggable="false" />
            <span>Yéti</span>
          </button>
          <button class="monster" data-monster="zombie" type="button" aria-label="Zombie — écouter son cri">
            <img src="assets/images/zombie.png" alt="Zombie" draggable="false" />
            <span>Zombie</span>
          </button>
          <button class="monster" data-monster="fantome" type="button" aria-label="Fantôme — écouter son cri">
            <img src="assets/images/fantome.png" alt="Fantôme" draggable="false" />
            <span>Fantôme</span>
          </button>
        </div>

        <div id="messageBar" class="message-bar">Touchez un monstre pour entendre son cri.</div>

        <div id="errorOverlay" class="overlay" hidden>
          <img src="assets/images/error.png" alt="Mauvaise réponse" />
          <div class="overlay-card"><strong>Oups !</strong><span>Réécoute les cris et réessaie.</span></div>
        </div>

        <div id="victoryOverlay" class="overlay victory-overlay" hidden>
          <img src="assets/images/victory.png" alt="Victoire" />
          <img class="thorgal" src="assets/images/thorgal.png" alt="Thorgal" />
          <div class="overlay-card victory-card">
            <strong>Bravo !</strong>
            <span>Tu as remporté 4 manches.</span>
            <button id="replayButton" class="main-button" type="button">Rejouer</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="game.js" defer></script>
</body>
</html>
